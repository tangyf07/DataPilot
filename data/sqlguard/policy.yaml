# DataPilot demo: allow SELECT on GameStream ADS tables; block destructive writes.
environment: demo
rules:
  select: allow
  insert: approval
  update: approval
  delete: block
  ddl: block
limits:
  update_rows: 100
  delete_rows: 50
permissions:
  enforce: true
  tables:
    ads_dau_di: [select]
    ads_retention_nd: [select]
    ads_arpu_di: [select]
    ads_pay_rate_di: [select]
    ads_online_duration_di: [select]
    ads_dungeon_clear_rate_di: [select]
    ads_churn_di: [select]
hallucination:
  allow_unknown_tables: false
  allow_unknown_columns: false
